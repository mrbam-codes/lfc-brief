<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-VolrYG6a+HuUjOcsAddDIEto2kDm4edyKbB+fTHpoxI='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05040a">
<title>Red Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05040a;--card:#100d1c;--line:#2a2440;--dim:#9a96b6;--red:#ff2a4f;--teal:#00f0c8;--amber:#ffb000;--ink:#f4f2ff}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hero{position:relative;min-height:90svh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 18px 30px;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero::before{content:'';position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(rgba(5,4,10,0),rgba(5,4,10,.95) 55%);z-index:1;pointer-events:none}
.hero>*:not(canvas){position:relative;z-index:2}
.brand{position:absolute!important;top:calc(14px + env(safe-area-inset-top));left:18px;font:400 18px Anton,Impact,sans-serif;letter-spacing:.08em}
.brand b{color:var(--red);font-weight:400}
.world{position:absolute!important;top:calc(18px + env(safe-area-inset-top));right:18px;font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.date{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--amber);text-transform:uppercase}
.verdict{font-size:34px;line-height:1.06;font-weight:700;margin-top:8px}
.more{margin-top:14px;font-size:14px;color:var(--dim)}
.poster{min-height:80svh;padding:26px 18px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;cursor:pointer}
.poster .k{position:absolute;top:24px;left:18px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.big{font-family:Anton,Impact,sans-serif;font-size:130px;line-height:1;white-space:nowrap}
.poster h2{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:46px;line-height:1.02;text-transform:uppercase;margin-top:8px}
.poster .noBig h2{font-size:64px}
.poster p{font-size:16px;line-height:1.38;font-weight:500;margin-top:12px}
.poster a{display:inline-block;font-size:13px;margin-top:12px;font-weight:700;padding:6px 0}
.poster .cue{display:block;margin-top:12px;font-size:14px;font-weight:700;text-decoration:underline;color:inherit}
.p-LFC{background:var(--red);color:#fff}.p-PL{background:#7c4dff;color:#fff}.p-UCL{background:#0a3dff;color:#fff}.p-LaLiga{background:var(--amber);color:#000}.p-SerieA{background:#00b3ff;color:#000}
.wrap{padding:22px 16px 30px;max-width:720px;margin:0 auto}
.sect{display:flex;justify-content:space-between;align-items:baseline;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin:30px 2px 12px}
.sect small{font-size:11px;color:var(--dim);letter-spacing:.05em;text-transform:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card:active{transform:scale(.99)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;background:#ffffff1a;color:var(--ink)}
.pill.LFC{background:var(--red)}.pill.PL{background:#7c4dff}.pill.UCL{background:#0a3dff}.pill.LaLiga{background:var(--amber);color:#000}.pill.SerieA{background:#00b3ff;color:#000}
.card h3{font-size:18px;line-height:1.22;margin:8px 0 6px}
.card p{font-size:15px;line-height:1.4;color:var(--dim)}
.card a{display:inline-block;font-size:13px;font-weight:700;color:var(--ink);margin-top:8px;padding:4px 0}
.cue{display:block;margin-top:8px;font-size:13px;font-weight:700;color:var(--teal)}
.strip{display:grid;grid-template-columns:1fr;gap:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.panel h4{font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
.next .opp{font:400 34px/1 Anton,Impact,sans-serif;text-transform:uppercase}
.next .cd{font:700 22px ui-monospace,Menlo,monospace;color:var(--amber);margin-top:6px}
.next p{font-size:14px;line-height:1.4;color:var(--dim);margin-top:8px}
.xi{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.xi span{font-size:12px;padding:3px 8px;border-radius:99px;border:1px solid var(--line)}
.fx{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}.fx:first-of-type{border-top:0}
.fx b{font-weight:700}.fx span{color:var(--dim);font-size:13px;text-align:right}
table{width:100%;border-collapse:collapse;font:14px ui-monospace,Menlo,monospace}
td{padding:6px 2px;border-top:1px solid var(--line)}td.n{text-align:right;color:var(--dim)}tr.us td{color:var(--red);font-weight:700}tr:first-child td{border-top:0}
.inj{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}.inj:first-of-type{border-top:0}
.st{font:700 10px ui-monospace,Menlo,monospace;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;align-self:flex-start}
.st.out{background:var(--red)}.st.doubt{background:var(--amber);color:#000}.st.back{background:var(--teal);color:#000}
.inj small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.tracker{display:grid;gap:10px}
.rum{position:relative;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--t);border-radius:14px;padding:13px 14px;cursor:pointer}
.rum .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rum h3{font-size:17px;line-height:1.2}
.rum .meta{font-size:12px;color:var(--dim);margin-top:3px}
.tier{font:700 11px ui-monospace,Menlo,monospace;padding:3px 8px;border-radius:6px;background:var(--t);color:#000;white-space:nowrap}
.heat{height:6px;border-radius:3px;background:#ffffff14;margin:10px 0 8px;overflow:hidden}.heat i{display:block;height:100%;background:var(--t);box-shadow:0 0 10px var(--t)}
.rum p{font-size:14px;line-height:1.4}
.rum .chg{display:inline-block;font:700 10px ui-monospace,Menlo,monospace;color:var(--amber);letter-spacing:.1em;margin-right:6px}
.rum.closed{opacity:.6}
.legend{font-size:12px;color:var(--dim);line-height:1.5;margin-top:8px}
.tp{background:#0c0a12;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:10px;cursor:pointer}
.tp .call{display:inline-block;font:400 18px Anton,Impact,sans-serif;letter-spacing:.06em;color:var(--amber);border:2px solid var(--amber);padding:2px 10px;transform:rotate(-2deg);margin-bottom:8px}
.tp h3{font-size:18px;line-height:1.22;margin-bottom:6px}.tp p{font-size:15px;line-height:1.4;color:var(--dim)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.sides div{font-size:13px;line-height:1.4;padding:10px;border-radius:10px;background:#ffffff0a}
.sides b{display:block;font:700 10px ui-monospace,Menlo,monospace;letter-spacing:.12em;margin-bottom:4px}.sides .f b{color:var(--teal)}.sides .a b{color:var(--red)}
.mood{background:#0c0a12;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}
.mood .mw{font:400 46px/1 Anton,Impact,sans-serif;letter-spacing:.02em;text-transform:uppercase;color:var(--mc)}
.mood .mb{font:500 11px ui-monospace,Menlo,monospace;color:var(--dim);margin:6px 0 12px}
.mbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#ffffff10}.mbar i{display:block;height:100%}
.mkey{display:flex;gap:12px;flex-wrap:wrap;font:600 11px ui-monospace,Menlo,monospace;margin:6px 0 12px}.mkey span:before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--k)}
.mood ul{list-style:none;margin:0;padding:0}.mood li{font-size:15px;line-height:1.4;padding:7px 0 7px 14px;border-top:1px solid var(--line);position:relative}.mood li:before{content:'';position:absolute;left:0;top:14px;width:6px;height:6px;border-radius:50%;background:var(--mc)}
.fq{background:#0c0a12;border:1px solid var(--line);border-left:3px solid var(--qc);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.fq .qa{font:700 10px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--qc);text-transform:uppercase}
.fq q{display:block;font-size:17px;line-height:1.38;margin:6px 0;quotes:'\201C' '\201D'}
.qk{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;letter-spacing:.08em}.qk.ins{background:var(--teal);color:#000}.qk.nc{border:1px solid var(--red);color:var(--red);transform:rotate(-2deg)}
.fq .qw{font-size:12px;color:var(--dim)}.fq .qw a{color:var(--dim)}
.xfeed{background:#000;border:1px solid #2f3336;border-radius:16px;overflow:hidden;box-shadow:0 0 26px -12px var(--red)}
.xhead{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid #2f3336;font-weight:700;font-size:16px}
.xlogo{display:block;width:20px;height:20px}.xlogo svg{display:block;width:100%;height:100%}
.xitem{position:relative;padding:14px 15px 14px 50px;border-bottom:1px solid #2f3336}
.xdot{position:absolute;left:18px;top:19px;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.xline{position:absolute;left:24px;top:35px;bottom:-20px;width:2px;background:linear-gradient(var(--c),#2f3336)}
.xitem:last-of-type{border-bottom:0}.xitem:last-of-type .xline{display:none}
.xwho{font:700 13px ui-monospace,Menlo,monospace;color:var(--c);overflow-wrap:anywhere}
.xitem h3{font-size:17px;line-height:1.22;margin:5px 0}.xitem p{font-size:15px;line-height:1.4;color:#d8d2ee}
.xitem a{display:inline-block;font-size:13px;font-weight:700;margin-top:8px;color:var(--c)}
.trust{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid var(--dim);color:var(--dim)}
.trust.Confirmed{border-color:var(--teal);color:var(--teal)}.trust.Unverified{border-color:var(--red);color:var(--red)}.trust.Opinion{border-color:var(--amber);color:var(--amber)}
.xnote{padding:10px 15px;border-top:1px solid #2f3336;font-size:12px;color:#8b8fa0}
.empty{font-size:14px;color:var(--dim);padding:6px 2px}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet .bar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.sheet .close{font-size:15px;font-weight:700;padding:8px 14px;border:1px solid var(--line);border-radius:99px}
.sheet .body{padding:20px 18px 60px;max-width:680px;margin:0 auto}
.sheet h2{font-size:28px;line-height:1.12;margin:10px 0 8px}
.sheet .meta{font-size:13px;color:var(--dim)}
.sheet h3{font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:22px 0 6px}
.sheet p{font-size:17px;line-height:1.5}
.sheet .take{background:linear-gradient(160deg,#ff2a4f,#5b1030);border-radius:16px;padding:16px;margin-top:24px}
.sheet .take h3{color:#fff;margin-top:0}
.sheet .orig{display:block;margin-top:14px;font-size:14px;color:var(--teal);padding:6px 0}
.err{padding:40px 18px;font-size:18px}
footer{padding:10px 16px 40px;font-size:14px;color:var(--dim);max-width:720px;margin:0 auto}
footer a{display:inline-block;margin:4px 12px 4px 0;padding:4px 0}
.pv{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;font-size:13px;font-weight:700}
.pv button{width:40px;height:40px;border-radius:99px;border:1px solid var(--line);background:#100d1ccc;font-size:21px;line-height:1}
@media (min-width:640px){.strip{grid-template-columns:1fr 1fr}.strip .next{grid-column:1/-1}}
</style>

<body>
<div id="app"></div>
<script>
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n};
const safe=u=>/^https:\/\//.test(u||'')?u:'#';
const link=(txt,u,c)=>{const a=el('a',c||null,txt);a.href=safe(u);a.target='_blank';a.rel='noopener';return a};
const fit=(n,max)=>{requestAnimationFrame(()=>{let s=max;n.style.fontSize=s+'px';const w=n.parentElement.clientWidth;while(n.scrollWidth>w&&s>30){s-=2;n.style.fontSize=s+'px'}})};
const BUILD='2026-11-08.3';
const TAGNAME={LFC:'Liverpool',PL:'Premier League',UCL:'Champions League',LaLiga:'La Liga',SerieA:'Serie A'};
const TIER={1:'#00f0c8',2:'#ffb000',3:'#ff2a4f'},HEAT={hot:88,warm:62,cooling:34,done:100,dead:6};
const stack=[];
addEventListener('popstate',()=>{const t=stack.pop();if(t){t.sh.remove();t.prev&&t.prev.focus&&t.prev.focus();if(!stack.length)document.body.style.overflow=''}});
addEventListener('keydown',e=>{if(e.key==='Escape'&&stack.length)history.back()});
function sheet(label){const prev=document.activeElement,sh=el('div','sheet');sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');
  const bar=el('div','bar'),cl=el('button','close','← Back');cl.onclick=()=>history.back();bar.append(el('strong',null,label||''),cl);
  const bd=el('div','body');sh.append(bar,bd);document.body.append(sh);document.body.style.overflow='hidden';cl.focus();history.pushState({s:1},'');stack.push({sh,prev});return bd}
const tappable=(n,fn)=>{n.tabIndex=0;n.setAttribute('role','button');n.onclick=e=>{if(e.target.closest('a'))return;fn()};n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}}};
function takeBox(bd,t){if(!t)return;const k=el('div','take');k.append(el('h3',null,'Claude’s take (opinion)'),el('p',null,t));bd.append(k)}
function openStory(s){const bd=sheet(TAGNAME[s.tag]),r=s.read||{};bd.append(el('h2',null,s.headline),el('div','meta','Source: '+s.source.name+', '+s.source.date));
  [['What happened','what'],['Why it matters','context']].forEach(([t,k])=>{if(r[k])bd.append(el('h3',null,t),el('p',null,r[k]))});takeBox(bd,r.take);bd.append(link('Read the original at '+s.source.name+' ↗',s.source.url,'orig'))}
function openRumour(q){const bd=sheet('Rumour tracker');bd.append(el('h2',null,q.player),el('div','meta',q.position+' · '+q.club+' · '+q.move+' · Tier '+q.tier+' · '+q.status));
  bd.append(el('h3',null,'Latest'),el('p',null,q.update),el('h3',null,'Tracked since'),el('p',null,q.firstSeen+' (last change '+q.lastChange+')'),el('h3',null,'Who is reporting it'));
  q.reportedBy.forEach(r=>bd.append(link(r.outlet+(r.journalist?', '+r.journalist:'')+', '+r.date+' ↗',r.url,'orig')));
  bd.append(el('h3',null,'What the tiers mean'),el('p',null,'Tier 1: the club, or reporters who are almost never wrong on Liverpool deals. Tier 2: major outlets and the Liverpool Echo. Tier 3: tabloids and aggregators, shown only when two outlets carry it.'))}
function openTalk(t){const bd=sheet('Talking point');if(t.call)bd.append(el('div','meta','Decision: '+t.call));bd.append(el('h2',null,t.headline),el('p',null,t.summary),el('h3',null,'The case for'),el('p',null,t.for),el('h3',null,'The case against'),el('p',null,t.against));takeBox(bd,t.take);bd.append(link('Source: '+t.source.name+' ↗',t.source.url,'orig'))}
const X_LOGO='<svg viewBox="0 0 24 24" aria-label="X"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>';
function cd(k){const s=Math.floor((Date.parse(k)-Date.now())/1000);if(isNaN(s))return'';if(s<=0)return s>-7200?'Kick-off now':'Played';const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+'d ':'')+h+'h '+m+'m to kick-off'}
function sect(m,t,sub){const s=el('div','sect');s.append(el('span',null,t));if(sub)s.append(el('small',null,sub));m.append(s)}
function storyCard(m,s){const k=el('article','card');k.append(el('span','pill '+s.tag,TAGNAME[s.tag]),el('h3',null,s.headline),el('p',null,s.summary),link(s.source.name+', '+s.source.date+' ↗',s.source.url));k.append(el('span','cue','Read the short version →'));tappable(k,()=>openStory(s));m.append(k)}
function tracker(m,b){const tr=b.tracker||[],live=tr.filter(q=>!['done','dead'].includes(q.status)).length;sect(m,'Rumour tracker',live+' live · '+(b.window?'window open':'window closed'));
  const box=el('div','tracker');if(!tr.length)box.append(el('p','empty','No live Liverpool rumours today.'));
  tr.forEach(q=>{const k=el('article','rum'+(['done','dead'].includes(q.status)?' closed':''));k.style.setProperty('--t',TIER[q.tier]);
    const top=el('div','top'),l=el('div');l.append(el('h3',null,q.player),el('div','meta',q.position+' · '+q.club+' · '+q.move));top.append(l,el('span','tier','TIER '+q.tier));
    const h=el('div','heat'),i=el('i');i.style.width=(HEAT[q.status]||50)+'%';h.append(i);
    const p=el('p');if(q.lastChange===b.date)p.append(el('span','chg','NEW TODAY'));p.append(q.status.toUpperCase()+': '+q.update);
    k.append(top,h,p,el('div','meta',q.reportedBy.map(r=>r.outlet).join(', ')));tappable(k,()=>openRumour(q));box.append(k)});
  m.append(box,el('p','legend','Tier 1 is near certain, Tier 2 is a major outlet, Tier 3 is gossip carried by at least two outlets. The bar is how hot the story is, not a probability.'))}
function render(b,list){const app=document.getElementById('app');document.title='Red Brief: '+b.dayLabel;
  const h=el('header','hero'),c=document.createElement('canvas'),brand=el('div','brand'),wn=el('div','world');brand.innerHTML='RED <b>BRIEF</b>';
  const all=[...b.posters,...(b.stories||[])];
  h.append(c,brand,wn,el('div','date',b.dayLabel),el('h1','verdict',b.verdict),el('div','more',all.length+' stories, '+(b.tracker||[]).length+' rumours tracked ↓'));app.append(h);
  const m=el('main','wrap');
  if(b.window){tracker(m,b);app.append(m)}
  b.posters.forEach(p=>{const s=el('section','poster p-'+p.tag);s.append(el('span','k',TAGNAME[p.tag]));const w=el('div',p.big?'':'noBig');
    if(p.big){const n=el('div','big',p.big);w.append(n);setTimeout(()=>fit(n,130))}
    w.append(el('h2',null,p.headline),el('p',null,p.summary),link(p.source.name+', '+p.source.date+' ↗',p.source.url),el('span','cue','Read the short version →'));s.append(w);tappable(s,()=>openStory(p));app.append(s)});
  const m2=el('main','wrap');
  const lfc=(b.stories||[]).filter(s=>s.tag==='LFC');if(lfc.length){sect(m2,'Liverpool');lfc.forEach(s=>storyCard(m2,s))}
  sect(m2,'Team, fixtures and table');const strip=el('div','strip');
  if(b.nextMatch){const n=b.nextMatch,p=el('div','panel next');p.append(el('h4',null,'Next: '+n.comp+(n.venue==='H'?' · home':n.venue==='A'?' · away':'')),el('div','opp',n.opp),el('div','cd',cd(n.kickoff)),el('p',null,n.teamNews));
    if((n.likelyXI||[]).length){p.append(el('h4',null,'Likely XI (not confirmed)'));const x=el('div','xi');n.likelyXI.forEach(t=>x.append(el('span',null,t)));p.append(x)}strip.append(p)}
  if(b.lastMatch){const l=b.lastMatch,p=el('div','panel');p.append(el('h4',null,'Last: '+l.comp+', '+l.date),el('div','next',''));const o=el('div','opp');o.style.font='400 30px Anton,Impact,sans-serif';o.textContent='LFC '+l.us+'-'+l.them+' '+l.opp.toUpperCase();p.append(o);
